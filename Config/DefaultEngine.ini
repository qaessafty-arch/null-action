[/Script/EngineSettings.GameMapsSettings]
; Create this level once in the editor: File > New Level > Empty Level, save as
; Content/NullAction/Maps/L_TestArena. The game mode builds the test arena in it.
GameDefaultMap=/Game/NullAction/Maps/L_TestArena.L_TestArena
EditorStartupMap=/Game/NullAction/Maps/L_TestArena.L_TestArena
ServerDefaultMap=/Game/NullAction/Maps/L_TestArena.L_TestArena
GlobalDefaultGameMode=/Script/NullAction.NAGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
; Realism: Temporal Super Resolution, Nanite meshes, virtual textures (Megascans), wider auto-exposure range,
; Lumen tracing against mesh distance fields for better indoor/forest lighting.
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True
r.VirtualTextures=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Lumen.TraceMeshSDFs=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True

[/Script/Engine.Engine]
NearClipPlane=5.0

[/Script/Engine.CollisionProfile]
; "Weapon" trace channel (ECC_GameTraceChannel1, aliased NA_TRACE_WEAPON in code). Blocks by default,
; so walls and characters stop bullets; pickups and dead bodies opt out.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")

[/Script/NavigationSystem.RecastNavMesh]
; Rebuild navigation at runtime so the code-built arena (spawned when play starts) is walkable for AI.
; Needs a Nav Mesh Bounds Volume in the level (see NULL_ACTION_STATUS.md). Without one, AI moves in straight lines.
RuntimeGeneration=Dynamic
